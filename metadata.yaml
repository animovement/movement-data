    FreeMoCap's processing pipeline, split_and_save() and DataSaver.save_all(),
    with FreeMoCap's modules taken unchanged from the git tag named in
    version and skellytracker 2025.10.1024's MediapipeModelInfo. No values
    were changed or filled. The 478 face mesh points are left out, to keep the
    file small: the wide face file is removed before DataSaver runs, which its
    loader handles as a recording without face data. The zip has no
    synchronized_videos/ folder, so the timestamps are empty, as FreeMoCap
    writes them for a recording without one.
