    determined_by: file
    variant: rigid-body-quaternion
  shared_by:
    name: null
    affiliation: null
  upstream:
    source: null
    license: null
  modification: Excerpt; the full take is 190,951 frames.
  note: >-
    PROVENANCE UNCONFIRMED. Motive is one of the few formats here that versions its
    export explicitly: the first header cell reads "Format Version,1.23". Take name
    sept-18_mixed-group_16-30, captured 2019-09-18 16:30:02, quaternion rotations,
    global coordinate space, metres. Three rigid bodies - device02, device03, device05 -
    each contributing 8 columns (4 rotation, 3 position, 1 error), so 24 columns in all.
    The names suggest tracked hardware or marker-tagged objects rather than bare animals.
    The sample-data audit (movement-data#12) identified it as pathviewr's
    inst/extdata/pathviewr_motive_example_data.csv (ropensci/pathviewr 1.1.8;
    authors Baliga, Armstrong and Press), with CRLF line endings changed to LF
