    every 0.5 s with Trial time, Recording time, X center, Y center (mm),
    Area, Areachange, Elongation, Distance moved, Velocity and Result 1. A
    unit row follows the column names. ISO-8859-1 encoded (the unit "mm²"),
    CRLF line endings, decimal commas in header values but decimal points in
    the data, "-" for missing values. The smallest raw file in the record
    (1,876 samples), although its header states a six-hour trial. The
    EthoVision version is not recorded. The dataset is documented at
    https://osf.io/r5vaq.

