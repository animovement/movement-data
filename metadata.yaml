# Metadata for every file in data/.
#
# Schema follows neuroinformatics/movement-test-data so the two repositories stay
# diffable, with three additions that a *reader* library needs and a *format* library
# does not:
#
#   version:      which release of the producing software wrote the file, and how we
#                 know. Export layouts drift between releases (FreeMoCap, AnimalTA and
#                 TRex have all changed theirs), so a fixture is only meaningful if the
#                 variant it exercises is named.
#                   source_version  application version, verbatim as recorded in the file
#                   format_version  export/format spec version, where separately versioned
#                   determined_by   file      - read out of the file itself
#                                   inferred  - deduced from column layout or header shape
#                                   unknown   - not recorded and not safely inferable
#                   variant         short name for the export layout this file exercises
#
#   upstream:     where the file came from, if it was not produced for this repository.
#   modification: what was changed relative to that upstream, if anything.
#
# Regenerate the sha256sum fields with `python3 update_hashes.py`.

