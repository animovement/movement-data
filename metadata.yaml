    Max Staras (Sainsbury Wellcome Centre, UCL) and the movement project.
    One person doing four star jumps, 216 frames at 30 fps (the rate is in the
    upstream recording_parameters.json, not in this file), tracked with
    MediaPipe holistic and two cameras. The tidy by_frame export with reprojection_error, the
    9-column layout FreeMoCap writes from v1.7.4 (movement-data#10): models
    mediapipe_body (33 points), mediapipe_hand (42) and mediapipe_com (15).
    reprojection_error is the recording's own, NaN where a point was not
    triangulated, and empty for the centres of mass, as FreeMoCap writes it.
    Supersedes freemocap_test_data_by_frame.csv as aniread's FreeMoCap sample.
    The version is inferred because FreeMoCap records none in the file; it
    was written by v1.8.2's code.

